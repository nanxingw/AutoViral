# CI — build the daemon + frontend, then run the web and server test suites.
#
# Action versions verified 2026-06-02 against the upstream READMEs:
#   actions/checkout@v6 · actions/setup-node@v6
#
# Test concurrency is deliberately constrained: the vitest configs cap workers
# (web maxThreads=2, server maxForks=2) and the project rule is "绝不并发跑两个
# vitest". We therefore run test:web then test:server as SEQUENTIAL steps and add
# no concurrency-raising flags. The two suites already self-pkill stale runs via
# their pretest hooks.
name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main
      - "refactor/**"

# One in-flight run per ref; a newer push cancels the older run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm

      # ffmpeg is REQUIRED, intentionally: src/audio-tools.test.ts has REAL
      # ffmpeg/ffprobe integration tests (the "...(integration)" describe) — the
      # ONLY tests in the suite that shell out to real binaries. Without ffmpeg
      # on PATH they ENOENT and test:server can never be fully green. Everything
      # else (python-bridge, reframe, render) mocks spawn, so no python is needed.
      - name: Install ffmpeg (for audio-tools integration tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      # build = build:backend (tsc + write-dist-pkg.mjs) + build:frontend (vite).
      # build:backend's `tsc` type-checks the daemon/shared source; build:frontend
      # (vite) bundles the web app but does NOT type-check it. The web typecheck
      # gate below covers that gap.
      - name: Build
        run: npm run build

      # vite never runs tsc on web/, so web's strictest tsconfig
      # (noUnusedLocals / noUnusedParameters / noFallthroughCasesInSwitch /
      # verbatimModuleSyntax) only enforces here. Keep it after Build so a green
      # build is a precondition.
      - name: Typecheck (web)
        run: npm run typecheck:web

      # Sequential test steps — never concurrent (see header note + project rule).
      - name: Test (web)
        run: npm run test:web

      - name: Test (server)
        run: npm run test:server

      # The root `build` step above is build:backend (rootDir ./src) + build:frontend
      # — it NEVER compiles cli/autoviral/src, so the bundled agent-protocol CLI
      # (shipped in npm "files" + app.asar) and its ~1936 lines of tests were
      # ungated: a broken CLI would ship with a green CI. test:cli closes that gap.
      # Its pretest (`npm run build` inside cli/autoviral = tsup) compiles the CLI,
      # so this one step covers CLI build + test together.
      - name: Test (cli)
        run: npm run test:cli

  # ─── PRD-0014 S16 — preview=export consistency gate (RUN_CONSISTENCY_GATE=1) ──
  # The FULL A(still)-vs-B(export) fixtures (transitionIn / speed / mask / blend /
  # effects / adjustment / freeze / reverse) are describe.skipIf(!RUN_CONSISTENCY_
  # GATE) — WITHOUT this variable they NEVER run, so the WYSIWYG regression net had
  # zero teeth in CI (S16 review finding #1). This dedicated job opts in. It is a
  # SEPARATE runner from build-and-test, so it does NOT violate "绝不并发跑两个
  # vitest" (that rule is about one machine — these are distinct VMs) and it does
  # NOT re-run the whole test:server suite: it runs ONLY consistency-gate.test.ts.
  #
  # Deps the gate shells out to (execFile-probed at runtime, never guessed):
  #   • ffmpeg/ffprobe — the daemon resolves the VENDORED ffmpeg-static /
  #     @ffprobe-installer binaries (installed by `npm ci`), which include libx264
  #     + lavfi; apt ffmpeg is belt-and-braces parity with build-and-test.
  #   • Chromium — Remotion renders the still (A) + export Stage-1 (B) in a headless
  #     Chrome. `remotion browser ensure` downloads chrome-headless-shell into
  #     node_modules/.remotion where the renderer finds it (AUTOVIRAL_CHROMIUM_PATH
  #     stays unset → renderer uses that cache).
  consistency-gate:
    name: consistency gate (WYSIWYG)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install ffmpeg (parity with build-and-test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      # Download the headless Chrome shell into node_modules/.remotion so the
      # still (A) + export (B) render paths have a browser. Fails the job loudly
      # here (not mid-render at the 120s delayRender timeout) if the download
      # can't complete.
      - name: Ensure Remotion Chromium
        run: npx remotion browser ensure

      # RUN only the gate file with the opt-in flag. `npm run test:server -- <file>`
      # goes through the pretest hook (which no-ops under CI) and does NOT bypass
      # npm; the FULL fixtures now actually execute.
      - name: Consistency gate (RUN_CONSISTENCY_GATE=1)
        env:
          RUN_CONSISTENCY_GATE: "1"
        run: npm run test:server -- src/server/__tests__/consistency-gate.test.ts
